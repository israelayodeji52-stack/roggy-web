services:
  postgres:
    image: postgres:17
    container_name: roggy-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: roggy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - roggy_postgres_data:/var/lib/postgresql/data

volumes:
  roggy_postgres_data:
